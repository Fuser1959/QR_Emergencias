<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Iniciar sesión — QR Emergencia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width:420px;">
  <div class="text-center mb-4">
    <div style="font-size:2.5rem;">🚨</div>
    <h1 class="h4 mt-2">QR Emergencia</h1>
    <p class="text-muted small">Iniciá sesión para gestionar tus etiquetas</p>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-4">

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ 'success' if cat == 'success' else 'danger' }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}

      {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login" autocomplete="on">
        <input type="hidden" name="next" value="{{ next }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="mb-3">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" name="email" class="form-control" placeholder="tu@email.com"
                 required value="{{ request.form.get('email','') }}" autofocus>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Contraseña</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
        </div>
      </form>

      <div class="text-center small">
        <a href="/forgot" class="text-muted">Olvidé mi contraseña</a>
      </div>

    </div>
  </div>

  <p class="text-center mt-3 small">
    ¿No tenés cuenta?
    <a href="/register?next={{ next | urlencode }}">Registrate gratis</a>
  </p>
</div>

</body>
</html>
