<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Crear cuenta — QR Emergencia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width:480px;">
  <div class="text-center mb-4">
    <div style="font-size:2.5rem;">🚨</div>
    <h1 class="h4 mt-2">Crear cuenta</h1>
    <p class="text-muted small">Registrate para gestionar tus etiquetas QR</p>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-4">

      {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
      {% endif %}

      <form method="post" action="/register" autocomplete="on">
        <input type="hidden" name="next" value="{{ next }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="row g-3 mb-3">
          <div class="col-sm-6">
            <label class="form-label fw-semibold">Nombre</label>
            <input type="text" name="nombre" class="form-control" placeholder="Juan"
                   required value="{{ request.form.get('nombre','') }}">
          </div>
          <div class="col-sm-6">
            <label class="form-label fw-semibold">Apellido</label>
            <input type="text" name="apellido" class="form-control" placeholder="Pérez"
                   required value="{{ request.form.get('apellido','') }}">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" name="email" class="form-control" placeholder="tu@email.com"
                 required value="{{ request.form.get('email','') }}">
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Contraseña</label>
          <input type="password" name="password" class="form-control"
                 placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg">Crear cuenta</button>
        </div>
      </form>

    </div>
  </div>

  <p class="text-center mt-3 small">
    ¿Ya tenés cuenta?
    <a href="/login?next={{ next | urlencode }}">Iniciar sesión</a>
  </p>
</div>

</body>
</html>
