<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Asociar QR — QR Emergencia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width:480px;">
  <div class="card shadow-sm">
    <div class="card-body p-4 text-center">
      <div style="font-size:3rem;">📲</div>
      <h1 class="h4 mt-2 mb-3">Asociar código QR</h1>
      <p class="text-muted">
        Vas a vincular el código <strong><code>{{ code }}</code></strong> a tu cuenta.
        Una vez asociado, quien escanee este QR verá tu ficha de emergencia.
      </p>
      <a href="/claim/{{ code }}" class="btn btn-primary btn-lg w-100 mt-2">
        Confirmar asociación
      </a>
      <a href="/panel" class="btn btn-outline-secondary w-100 mt-2">Cancelar</a>
    </div>
  </div>
</div>
</body>
</html>
