<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Restablecer contraseña — QR Emergencia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width:440px;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-3">Restablecer contraseña</h1>

      {% if invalid %}
        <div class="alert alert-danger">
          El enlace es inválido o ya expiró (duran 1 hora).
        </div>
        <a href="/forgot" class="btn btn-outline-primary w-100">Solicitar un nuevo enlace</a>
      {% else %}

        {% if error %}
          <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <p class="text-muted small mb-3">Elegí una contraseña nueva de al menos 6 caracteres.</p>

        <form method="post" autocomplete="off">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Nueva contraseña</label>
            <input type="password" name="password" class="form-control"
                   placeholder="••••••••" required minlength="6" autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Repetir contraseña</label>
            <input type="password" name="password2" class="form-control"
                   placeholder="••••••••" required minlength="6">
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">Guardar contraseña</button>
          </div>
        </form>

      {% endif %}
    </div>
  </div>
</div>

</body>
</html>
